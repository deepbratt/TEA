id: crawl.slow
title: Page takes longer than 3 seconds to load
description: "Pages that take longer than the limit you set to load. Slow pages lose visitors."
category: performance
severity: medium
detect: crawl
rule: scanner:crawl.slow
fix_prompt: prompts/crawl/slow.md
suggest_only: false
version: 1
params:
  thresholdMs:
    default: 3000
    description: Pages slower than this many milliseconds are reported
    min: 500
    max: 60000
