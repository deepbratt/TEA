<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">TEA: Test Everything Automatically</title>
  <desc id="d">A steaming cup of tea next to the words "TEA, Test Everything Automatically. Spill the TEA on your app." A score ring fills from 41 to 86.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181a"/>
      <stop offset="1" stop-color="#2a2d31"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a8d"/>
      <stop offset="1" stop-color="#b3262c"/>
    </linearGradient>
    <clipPath id="type"><rect x="300" y="200" height="40" width="0">
      <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .steam { fill: none; stroke: #e6e6e6; stroke-width: 6; stroke-linecap: round; opacity: 0; }
      .s1 { animation: rise 3s ease-in-out infinite; }
      .s2 { animation: rise 3s ease-in-out 1s infinite; }
      .s3 { animation: rise 3s ease-in-out 2s infinite; }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(18px); }
        30% { opacity: .75; }
        100% { opacity: 0; transform: translateY(-26px); }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="960" height="300" rx="28" fill="url(#bg)"/>
  <!-- faint grid of "checks" -->
  <g fill="#e6e6e6" opacity=".05">
    <circle cx="880" cy="40" r="3"/><circle cx="910" cy="40" r="3"/><circle cx="880" cy="70" r="3"/><circle cx="910" cy="70" r="3"/>
    <circle cx="40" cy="260" r="3"/><circle cx="70" cy="260" r="3"/><circle cx="40" cy="230" r="3"/>
  </g>

  <!-- steam -->
  <g transform="translate(0,0)">
    <path class="steam s1" d="M120 92 q-14 -18 0 -36 q14 -18 0 -36"/>
    <path class="steam s2" d="M160 92 q-14 -18 0 -36 q14 -18 0 -36"/>
    <path class="steam s3" d="M200 92 q-14 -18 0 -36 q14 -18 0 -36"/>
  </g>
  <!-- cup -->
  <path d="M80 110 h160 v40 a80 80 0 0 1 -160 0 z" fill="#e6e6e6"/>
  <ellipse cx="160" cy="110" rx="80" ry="14" fill="url(#tea)"/>
  <path d="M238 128 a26 26 0 1 1 0 52" fill="none" stroke="#e6e6e6" stroke-width="12"/>
  <ellipse cx="160" cy="236" rx="110" ry="16" fill="#e6e6e6" opacity=".9"/>
  <!-- tick on the cup -->
  <path d="M138 168 l16 16 l30 -34" fill="none" stroke="#b3262c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 100;100 0;100 0" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- words -->
  <text x="300" y="132" font-size="104" font-weight="800" fill="#e6e6e6" letter-spacing="4">TEA</text>
  <text x="304" y="180" font-size="28" font-weight="700" fill="#f05d61">Test Everything Automatically</text>
  <g clip-path="url(#type)">
    <text x="304" y="228" font-size="26" fill="#e6e6e6">Spill the TEA on your app.</text>
  </g>
  <rect class="cursor" x="304" y="206" width="3" height="28" fill="#f05d61">
    <animate attributeName="x" values="304;628;628;304" keyTimes="0;0.45;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- score ring: before 41, after 86 -->
  <g transform="translate(830 150)">
    <circle r="62" fill="none" stroke="#e6e6e6" stroke-opacity=".15" stroke-width="14"/>
    <circle r="62" fill="none" stroke-width="14" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="160 390" stroke="#ff5c5c">
      <animate attributeName="stroke-dasharray" values="160 390;160 390;335 390;335 390;160 390" keyTimes="0;0.3;0.55;0.92;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#ff5c5c;#ff5c5c;#4cd08a;#4cd08a;#ff5c5c" keyTimes="0;0.3;0.55;0.92;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" y="12" font-size="40" font-weight="800" fill="#e6e6e6" opacity="1">41<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text text-anchor="middle" y="12" font-size="40" font-weight="800" fill="#e6e6e6" opacity="0">86<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text text-anchor="middle" y="94" font-size="15" fill="#e6e6e6" opacity=".7">TEA Score: before → after</text>
  </g>
</svg>
