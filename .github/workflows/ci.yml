name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v --log-opts=HEAD

  checks:
    name: Lint, typecheck, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=moderate

  demo:
    name: TEA end to end on the example app (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TEA's runtime supports Node 20+; the unit tests' runner (Vitest 5) needs 22.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: npm run demo (build, start the example, run TEA, verify seeded bugs)
        run: npm run demo
      - name: Dry run and code-only mode work too
        run: |
          node packages/cli/dist/bin.js run examples/buggy-next-app --dry-run
          node packages/cli/dist/bin.js run examples/buggy-next-app --no-start --out tea-report-code-only --fail-on none
          test -f tea-report-code-only/feature-map.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tea-report-node-${{ matrix.node }}
          path: tea-report
