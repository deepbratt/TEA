name: Pages

# Publishes the project site (site/) to GitHub Pages, with a live sample report and a clickable
# demo of the Workbench, both from a real analysis of the bundled example app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sample report (TEA against the bundled example app)
        run: npm run demo
      - name: Clickable Workbench demo (static, recorded from a real analysis)
        run: node scripts/build-demo.mjs /TEA/demo
      - run: node scripts/build-site.mjs
      - name: Click through the demo as Pages serves it
        run: node scripts/demo-e2e.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
